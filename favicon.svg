<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="obnotion-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="obnotion-grad-core" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="obnotion-glow-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Glass Frame -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#13141c" stroke="url(#obnotion-grad-bg)" stroke-width="6" />

  <!-- Inner Subtle Glow -->
  <circle cx="50" cy="50" r="32" fill="url(#obnotion-glow-inner)" />

  <!-- Synaptic Hexagonal / Obsidian Nexus (O Shape) -->
  <path d="M50 22 L76 37 L76 67 L50 82 L24 67 L24 37 Z" stroke="url(#obnotion-grad-bg)" stroke-width="5" stroke-linejoin="round" fill="none" />

  <!-- Inner Graph Links -->
  <path d="M50 22 L50 50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M24 67 L50 50" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
  <path d="M76 67 L50 50" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <!-- Graph Nodes -->
  <circle cx="50" cy="22" r="6" fill="#38bdf8" />
  <circle cx="76" cy="37" r="5" fill="#818cf8" />
  <circle cx="76" cy="67" r="6" fill="#06b6d4" />
  <circle cx="50" cy="82" r="5.5" fill="#a855f7" />
  <circle cx="24" cy="67" r="6" fill="#c084fc" />
  <circle cx="24" cy="37" r="5" fill="#818cf8" />

  <!-- Central Core Spark -->
  <circle cx="50" cy="50" r="8" fill="url(#obnotion-grad-core)" />
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" />
</svg>