<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obnotion Studio Pro - Editor Gráfico Profissional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-main: #0c0d14;
      --bg-panel: #12131c;
      --bg-subpanel: #181926;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
    }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Photoshop Canvas Workspace */
    #canvas-viewport {
      background-color: #08080c;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.03) 0%, transparent 80%),
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
    }
    .transparent-pattern {
      background-image: linear-gradient(45deg, #1c1d29 25%, transparent 25%), 
                        linear-gradient(-45deg, #1c1d29 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1c1d29 75%), 
                        linear-gradient(-45deg, transparent 75%, #1c1d29 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #12131f;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .tool-btn.active {
      background-color: rgba(139, 92, 246, 0.25);
      color: #c4b5fd;
      border-color: rgba(139, 92, 246, 0.5);
    }
    .layer-item.active {
      background-color: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen text-xs">

  <!-- 1. TOP MENU BAR (Photoshop Classic) -->
  <header class="h-9 bg-[#10111a] border-b border-white/[0.08] flex items-center justify-between px-3 z-30 select-none">
    <div class="flex items-center gap-3">
      <!-- Obnotion Studio Logo Badge -->
      <div class="flex items-center gap-2 pr-3 border-r border-white/[0.08]">
        <div class="w-5 h-5 rounded-md bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">
          Ps
        </div>
        <span class="font-bold text-white tracking-tight text-[11px]">Obnotion Studio</span>
      </div>

      <!-- Menus dropdowns -->
      <div class="flex items-center gap-1">
        <!-- Arquivo -->
        <div class="relative group">
          <button class="px-2.5 py-1 rounded hover:bg-white/[0.06] text-zinc-300 hover:text-white transition-colors">Arquivo</button>
          <div class="absolute left-0 top-full mt-0.5 w-48 bg-[#161724] border border-white/[0.1] rounded-lg shadow-2xl py-1 hidden group-hover:block z-50">
            <button onclick="openNewModal()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between">
              <span>Novo Projeto</span>
              <span class="text-zinc-500 font-mono text-[10px]">Ctrl+N</span>
            </button>
            <label class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between cursor-pointer">
              <span>Abrir Imagem...</span>
              <span class="text-zinc-500 font-mono text-[10px]">Ctrl+O</span>
              <input type="file" id="file-input-image" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </label>
            <div class="h-px bg-white/[0.08] my-1"></div>
            <button onclick="exportImage('png')" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between">
              <span>Exportar PNG (Transparente)</span>
              <span class="text-zinc-500 font-mono text-[10px]">PNG</span>
            </button>
            <button onclick="exportImage('jpeg')" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between">
              <span>Exportar JPG (Alta Qualidade)</span>
              <span class="text-zinc-500 font-mono text-[10px]">JPG</span>
            </button>
            <button onclick="exportImage('webp')" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between">
              <span>Exportar WebP</span>
              <span class="text-zinc-500 font-mono text-[10px]">WebP</span>
            </button>
            <div class="h-px bg-white/[0.08] my-1"></div>
            <button onclick="saveProjectJSON()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between">
              <span>Salvar Projeto Obnotion</span>
              <span class="text-zinc-500 font-mono text-[10px]">.PSD/.OBS</span>
            </button>
          </div>
        </div>

        <!-- Editar -->
        <div class="relative group">
          <button class="px-2.5 py-1 rounded hover:bg-white/[0.06] text-zinc-300 hover:text-white transition-colors">Editar</button>
          <div class="absolute left-0 top-full mt-0.5 w-44 bg-[#161724] border border-white/[0.1] rounded-lg shadow-2xl py-1 hidden group-hover:block z-50">
            <button onclick="undo()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between">
              <span>Desfazer</span>
              <span class="text-zinc-500 font-mono text-[10px]">Ctrl+Z</span>
            </button>
            <button onclick="redo()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white flex justify-between">
              <span>Refazer</span>
              <span class="text-zinc-500 font-mono text-[10px]">Ctrl+Y</span>
            </button>
            <div class="h-px bg-white/[0.08] my-1"></div>
            <button onclick="clearCurrentLayer()" class="w-full px-3 py-1.5 text-left text-rose-400 hover:bg-rose-600/20 flex justify-between">
              <span>Limpar Camada</span>
              <span class="text-zinc-500 font-mono text-[10px]">Del</span>
            </button>
          </div>
        </div>

        <!-- Imagem & Ajustes -->
        <div class="relative group">
          <button class="px-2.5 py-1 rounded hover:bg-white/[0.06] text-zinc-300 hover:text-white transition-colors">Imagem</button>
          <div class="absolute left-0 top-full mt-0.5 w-52 bg-[#161724] border border-white/[0.1] rounded-lg shadow-2xl py-1 hidden group-hover:block z-50">
            <button onclick="applyAutoContrast()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Auto Contraste & Tom</button>
            <button onclick="applyInvertFilter()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Inverter Cores</button>
            <button onclick="applyGrayscaleFilter()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Preto & Branco (Monocromático)</button>
            <button onclick="applySepiaFilter()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Filtro Sépia Vintage</button>
            <div class="h-px bg-white/[0.08] my-1"></div>
            <button onclick="flipHorizontal()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Virar Horizontalmente</button>
            <button onclick="flipVertical()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Virar Verticalmente</button>
            <button onclick="rotate90()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Girar 90° Horário</button>
          </div>
        </div>

        <!-- Camada -->
        <div class="relative group">
          <button class="px-2.5 py-1 rounded hover:bg-white/[0.06] text-zinc-300 hover:text-white transition-colors">Camada</button>
          <div class="absolute left-0 top-full mt-0.5 w-48 bg-[#161724] border border-white/[0.1] rounded-lg shadow-2xl py-1 hidden group-hover:block z-50">
            <button onclick="addNewLayer()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Nova Camada</button>
            <button onclick="duplicateActiveLayer()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Duplicar Camada (Ctrl+J)</button>
            <button onclick="deleteActiveLayer()" class="w-full px-3 py-1.5 text-left text-rose-400 hover:bg-rose-600/20">Excluir Camada</button>
            <div class="h-px bg-white/[0.08] my-1"></div>
            <button onclick="mergeAllLayers()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Achatar Imagem (Mesclar)</button>
          </div>
        </div>

        <!-- Filtros -->
        <div class="relative group">
          <button class="px-2.5 py-1 rounded hover:bg-white/[0.06] text-zinc-300 hover:text-white transition-colors">Filtros</button>
          <div class="absolute left-0 top-full mt-0.5 w-48 bg-[#161724] border border-white/[0.1] rounded-lg shadow-2xl py-1 hidden group-hover:block z-50">
            <button onclick="applyBlurFilter(4)" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Desfoque Gaussiano Suave</button>
            <button onclick="applyBlurFilter(12)" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Desfoque Intenso</button>
            <button onclick="applySharpenFilter()" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Nitidez / Realce de Bordas</button>
            <button onclick="applyPixelateFilter(10)" class="w-full px-3 py-1.5 text-left text-zinc-200 hover:bg-violet-600/30 hover:text-white">Pixel Art / Pixelar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Controls: Zoom & Quick Export -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-black/40 px-2 py-0.5 rounded border border-white/[0.06] font-mono text-[11px] text-zinc-400">
        <button onclick="zoomOut()" class="hover:text-white p-0.5">-</button>
        <span id="zoom-text">100%</span>
        <button onclick="zoomIn()" class="hover:text-white p-0.5">+</button>
        <button onclick="zoomReset()" class="hover:text-violet-400 ml-1 text-[10px]" title="Ajustar à Tela">Ajustar</button>
      </div>

      <button onclick="exportImage('png')" class="px-3 py-1 rounded bg-violet-600 hover:bg-violet-500 text-white font-semibold text-[11px] transition-all flex items-center gap-1.5 shadow-sm">
        <i data-lucide="download" class="w-3 h-3"></i>
        <span>Salvar Imagem</span>
      </button>
    </div>
  </header>

  <!-- 2. TOOL OPTIONS BAR (Photoshop Context Bar) -->
  <div id="tool-options-bar" class="h-8 bg-[#13141f] border-b border-white/[0.06] flex items-center px-3 gap-4 text-zinc-300 select-none z-20">
    <div class="flex items-center gap-1.5 font-semibold text-white">
      <span id="active-tool-name">Pincel</span>
    </div>
    <div class="h-3.5 w-px bg-white/[0.1]"></div>

    <!-- Brush options -->
    <div id="options-brush" class="flex items-center gap-3">
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Tamanho:</span>
        <input type="range" id="brush-size" min="1" max="150" value="15" class="w-20 accent-violet-500" oninput="updateBrushPreview()">
        <span id="brush-size-val" class="font-mono w-6 text-right text-zinc-300">15px</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Opacidade:</span>
        <input type="range" id="brush-opacity" min="1" max="100" value="100" class="w-16 accent-violet-500" oninput="updateBrushPreview()">
        <span id="brush-opacity-val" class="font-mono w-7 text-right text-zinc-300">100%</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Dureza:</span>
        <input type="range" id="brush-hardness" min="0" max="100" value="100" class="w-16 accent-violet-500">
      </div>
    </div>

    <!-- Text options -->
    <div id="options-text" class="flex items-center gap-3 hidden">
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Fonte:</span>
        <select id="text-font" class="bg-black/50 border border-white/[0.1] rounded px-1.5 py-0.5 text-white">
          <option value="Plus Jakarta Sans">Plus Jakarta Sans</option>
          <option value="Impact">Impact (Memes/Banners)</option>
          <option value="Arial">Arial Standard</option>
          <option value="Georgia">Georgia Serif</option>
          <option value="JetBrains Mono">JetBrains Mono</option>
          <option value="Trebuchet MS">Trebuchet Modern</option>
        </select>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Tamanho:</span>
        <input type="number" id="text-size" min="8" max="300" value="48" class="w-14 bg-black/50 border border-white/[0.1] rounded px-1.5 py-0.5 text-white font-mono">
      </div>
      <div class="flex items-center gap-1">
        <button onclick="toggleTextWeight()" id="btn-text-bold" class="px-2 py-0.5 rounded bg-white/[0.04] border border-white/[0.08] font-bold">B</button>
      </div>
    </div>

    <!-- Shape options -->
    <div id="options-shape" class="flex items-center gap-3 hidden">
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Tipo:</span>
        <select id="shape-type" class="bg-black/50 border border-white/[0.1] rounded px-1.5 py-0.5 text-white">
          <option value="rect">Retângulo</option>
          <option value="circle">Círculo / Elipse</option>
          <option value="line">Linha Reta</option>
          <option value="star">Estrela</option>
        </select>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Preenchimento:</span>
        <input type="checkbox" id="shape-fill" checked class="accent-violet-500">
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-zinc-500">Contorno:</span>
        <input type="number" id="shape-stroke-width" min="0" max="50" value="0" class="w-12 bg-black/50 border border-white/[0.1] rounded px-1.5 py-0.5 text-white font-mono">
      </div>
    </div>
  </div>

  <!-- 3. MAIN WORKSPACE (Photoshop Split Grid) -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- LEFT TOOLBAR (Classic Vertical Bar) -->
    <aside class="w-11 bg-[#10111a] border-r border-white/[0.08] flex flex-col items-center py-2 gap-1 z-20 select-none">
      <!-- 1. Move Tool -->
      <button onclick="setTool('move')" id="tool-move" class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Mover (V)">
        <i data-lucide="move" class="w-4 h-4"></i>
      </button>

      <!-- 2. Select Rect -->
      <button onclick="setTool('select')" id="tool-select" class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Seleção Retangular (M)">
        <i data-lucide="scan" class="w-4 h-4"></i>
      </button>

      <!-- 3. Brush Tool -->
      <button onclick="setTool('brush')" id="tool-brush" class="tool-btn active w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Pincel (B)">
        <i data-lucide="paintbrush" class="w-4 h-4"></i>
      </button>

      <!-- 4. Eraser Tool -->
      <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Borracha (E)">
        <i data-lucide="eraser" class="w-4 h-4"></i>
      </button>

      <!-- 5. Paint Bucket -->
      <button onclick="setTool('bucket')" id="tool-bucket" class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Balde de Tinta / Preenchimento (G)">
        <i data-lucide="paint-bucket" class="w-4 h-4"></i>
      </button>

      <!-- 6. Text Tool -->
      <button onclick="setTool('text')" id="tool-text" class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Texto (T)">
        <i data-lucide="type" class="w-4 h-4"></i>
      </button>

      <!-- 7. Shape Tool -->
      <button onclick="setTool('shape')" id="tool-shape" class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Formas Geométricas (U)">
        <i data-lucide="square" class="w-4 h-4"></i>
      </button>

      <!-- 8. Eyedropper Tool -->
      <button onclick="setTool('eyedropper')" id="tool-eyedropper" class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.05] transition-all border border-transparent" title="Conta-Gotas / Seletor (I)">
        <i data-lucide="pipette" class="w-4 h-4"></i>
      </button>

      <div class="w-6 h-px bg-white/[0.08] my-1"></div>

      <!-- Photoshop Dual Color Palette -->
      <div class="relative w-8 h-8 mt-2">
        <input type="color" id="primary-color" value="#ffffff" class="w-5 h-5 absolute top-0 left-0 rounded cursor-pointer border border-white/40 p-0 bg-transparent" title="Cor Principal (Foreground)">
        <input type="color" id="secondary-color" value="#8b5cf6" class="w-5 h-5 absolute bottom-0 right-0 rounded cursor-pointer border border-white/40 p-0 bg-transparent" title="Cor Secundária (Background)">
        <button onclick="swapColors()" class="absolute -top-1 -right-1 text-zinc-500 hover:text-white text-[8px]" title="Alternar Cores (X)">⇄</button>
      </div>
    </aside>

    <!-- CENTER CANVAS VIEWPORT -->
    <main id="canvas-viewport" class="flex-1 flex items-center justify-center overflow-auto relative p-8">
      <div id="canvas-wrapper" class="relative shadow-2xl transition-transform duration-75 origin-center">
        <!-- Canvas stack rendered here dynamically -->
      </div>
    </main>

    <!-- RIGHT DOCKED PANELS (Layers, Adjustments, Properties) -->
    <aside class="w-72 bg-[#10111a] border-l border-white/[0.08] flex flex-col z-20 select-none">
      
      <!-- Panel Tabs -->
      <div class="h-8 bg-[#13141f] border-b border-white/[0.06] flex items-center px-2">
        <button class="px-3 py-1 border-b-2 border-violet-500 text-white font-semibold text-[11px]">Camadas</button>
        <button class="px-3 py-1 text-zinc-400 hover:text-zinc-200 text-[11px]" onclick="toggleTab('adjustments')">Ajustes</button>
      </div>

      <!-- 1. LAYERS PANEL -->
      <div id="panel-layers" class="flex-1 flex flex-col p-3 overflow-hidden">
        <!-- Layer Opacity & Blend Mode -->
        <div class="space-y-2 pb-3 border-b border-white/[0.06]">
          <div class="flex items-center justify-between">
            <span class="text-zinc-400 text-[10px] uppercase font-mono">Modo de Mesclagem</span>
            <select id="layer-blend-mode" onchange="updateActiveLayerBlend()" class="bg-black/50 border border-white/[0.1] rounded px-2 py-0.5 text-white text-[11px]">
              <option value="source-over">Normal</option>
              <option value="multiply">Multiplicação (Multiply)</option>
              <option value="screen">Divisão (Screen)</option>
              <option value="overlay">Sobreposição (Overlay)</option>
              <option value="darken">Escurecer (Darken)</option>
              <option value="lighten">Clarear (Lighten)</option>
              <option value="difference">Diferença</option>
            </select>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-zinc-400 text-[10px] uppercase font-mono">Opacidade</span>
            <div class="flex items-center gap-1.5">
              <input type="range" id="layer-opacity-slider" min="0" max="100" value="100" oninput="updateActiveLayerOpacity()" class="w-20 accent-violet-500">
              <span id="layer-opacity-val" class="font-mono text-zinc-300 text-[10px] w-7 text-right">100%</span>
            </div>
          </div>
        </div>

        <!-- Layers List -->
        <div id="layers-list" class="flex-1 overflow-y-auto py-2 space-y-1.5">
          <!-- Layer items injected here -->
        </div>

        <!-- Layers Bottom Toolbar (Add, Duplicate, Delete) -->
        <div class="pt-2 border-t border-white/[0.06] flex items-center justify-between">
          <div class="flex items-center gap-1">
            <button onclick="addNewLayer()" class="p-1.5 rounded hover:bg-white/[0.08] text-zinc-400 hover:text-white" title="Nova Camada">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="duplicateActiveLayer()" class="p-1.5 rounded hover:bg-white/[0.08] text-zinc-400 hover:text-white" title="Duplicar Camada (Ctrl+J)">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="moveLayerUp()" class="p-1.5 rounded hover:bg-white/[0.08] text-zinc-400 hover:text-white" title="Subir Camada">
              <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="moveLayerDown()" class="p-1.5 rounded hover:bg-white/[0.08] text-zinc-400 hover:text-white" title="Descer Camada">

  <!-- JAVASCRIPT ENGINE (Multi-Layer Photoshop Engine) -->
  <script>
    // State
    let projectWidth = 1080;
    let projectHeight = 1080;
    let zoomLevel = 0.6; // Default viewport scale
    let currentTool = 'brush';
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let layers = [];
    let activeLayerId = null;
    let historyStack = [];

    const wrapper = document.getElementById('canvas-wrapper');
    const primaryColorInput = document.getElementById('primary-color');
    const secondaryColorInput = document.getElementById('secondary-color');

    // Initialize Photoshop Project
    function init() {
      lucide.createIcons();
      createNewProject(1080, 1080, '#ffffff');
      window.addEventListener('keydown', handleGlobalKeydown);
    }

    function createNewProject(w, h, bg) {
      projectWidth = w || parseInt(document.getElementById('new-doc-w').value) || 1080;
      projectHeight = h || parseInt(document.getElementById('new-doc-h').value) || 1080;
      const initialBg = bg || document.getElementById('new-doc-bg').value;

      wrapper.style.width = `${projectWidth}px`;
      wrapper.style.height = `${projectHeight}px`;
      wrapper.innerHTML = '';
      wrapper.className = `relative shadow-2xl origin-center ${initialBg === 'transparent' ? 'transparent-pattern' : ''}`;

      layers = [];
      activeLayerId = null;

      // Layer 1: Background or Initial Layer
      addNewLayer(initialBg === 'transparent' ? 'Camada 1' : 'Plano de Fundo', initialBg);
      closeNewModal();
      fitCanvasToScreen();
    }

    function addNewLayer(name, fillColor = null) {
      const layerId = 'layer-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
      const canvas = document.createElement('canvas');
      canvas.width = projectWidth;
      canvas.height = projectHeight;
      canvas.id = layerId;
      canvas.className = 'absolute inset-0 pointer-events-none';
      canvas.style.opacity = '1';
      
      const ctx = canvas.getContext('2d');
      if (fillColor && fillColor !== 'transparent') {
        ctx.fillStyle = fillColor;
        ctx.fillRect(0, 0, projectWidth, projectHeight);
      }

      wrapper.appendChild(canvas);

      const newLayer = {
        id: layerId,
        name: name || `Camada ${layers.length + 1}`,
        canvas: canvas,
        ctx: ctx,
        visible: true,
        opacity: 1,
        blendMode: 'source-over'
      };

      layers.unshift(newLayer); // Add to top
      setActiveLayer(layerId);
      renderLayersList();
      saveHistoryState();
    }

    function setActiveLayer(id) {
      activeLayerId = id;
      const activeObj = layers.find(l => l.id === id);
      if (activeObj) {
        document.getElementById('layer-blend-mode').value = activeObj.blendMode || 'source-over';
        document.getElementById('layer-opacity-slider').value = Math.round(activeObj.opacity * 100);
        document.getElementById('layer-opacity-val').innerText = Math.round(activeObj.opacity * 100) + '%';
      }
      renderLayersList();
    }

    function getActiveLayer() {
      return layers.find(l => l.id === activeLayerId) || layers[0];
    }

    function renderLayersList() {
      const container = document.getElementById('layers-list');
      container.innerHTML = '';

      layers.forEach((layer, idx) => {
        const item = document.createElement('div');
        item.className = `layer-item p-2 rounded-lg border flex items-center justify-between transition-all cursor-pointer ${
          layer.id === activeLayerId 
            ? 'active bg-violet-600/20 border-violet-500/40 text-white font-semibold' 
            : 'bg-black/30 border-white/[0.05] text-zinc-400 hover:bg-white/[0.03]'
        }`;
        item.onclick = () => setActiveLayer(layer.id);

        item.innerHTML = `
          <div class="flex items-center gap-2 flex-1 truncate">
            <button onclick="toggleLayerVisibility('${layer.id}', event)" class="p-1 text-zinc-400 hover:text-white">
              <i data-lucide="${layer.visible ? 'eye' : 'eye-off'}" class="w-3.5 h-3.5"></i>
            </button>
            <div class="w-6 h-6 rounded bg-black/40 border border-white/[0.1] flex items-center justify-center overflow-hidden">
              <i data-lucide="image" class="w-3 h-3 text-zinc-500"></i>
            </div>
            <span class="text-xs truncate">${layer.name}</span>
          </div>
          <span class="text-[10px] font-mono text-zinc-500">${Math.round(layer.opacity * 100)}%</span>
        `;
        container.appendChild(item);
      });

      lucide.createIcons();
    }

    function toggleLayerVisibility(id, e) {
      if (e) e.stopPropagation();
      const l = layers.find(l => l.id === id);
      if (l) {
        l.visible = !l.visible;
        l.canvas.style.display = l.visible ? 'block' : 'none';
        renderLayersList();
      }
    }

    function updateActiveLayerOpacity() {
      const val = parseInt(document.getElementById('layer-opacity-slider').value) / 100;
      document.getElementById('layer-opacity-val').innerText = Math.round(val * 100) + '%';
      const l = getActiveLayer();
      if (l) {
        l.opacity = val;
        l.canvas.style.opacity = val;
      }
    }

    function updateActiveLayerBlend() {
      const mode = document.getElementById('layer-blend-mode').value;
      const l = getActiveLayer();
      if (l) {
        l.blendMode = mode;
        l.canvas.style.mixBlendMode = mode;
      }
    }

    function duplicateActiveLayer() {
      const source = getActiveLayer();
      if (!source) return;
      addNewLayer(source.name + ' (Cópia)');
      const dest = getActiveLayer();
      dest.ctx.drawImage(source.canvas, 0, 0);
      dest.opacity = source.opacity;
      dest.blendMode = source.blendMode;
      dest.canvas.style.opacity = source.opacity;
      dest.canvas.style.mixBlendMode = source.blendMode;
    }

    function deleteActiveLayer() {
      if (layers.length <= 1) return alert('Você deve manter pelo menos uma camada!');
      const index = layers.findIndex(l => l.id === activeLayerId);
      if (index !== -1) {
        const removed = layers.splice(index, 1)[0];
        removed.canvas.remove();
        setActiveLayer(layers[0].id);
        saveHistoryState();
      }
    }

    function clearCurrentLayer() {
      const l = getActiveLayer();
      if (l) {
        l.ctx.clearRect(0, 0, projectWidth, projectHeight);
        saveHistoryState();
      }
    }

    // DRAWING & CANVAS INTERACTION
    wrapper.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const rect = wrapper.getBoundingClientRect();
      const scale = rect.width / projectWidth;
      lastX = (e.clientX - rect.left) / scale;
      lastY = (e.clientY - rect.top) / scale;

      const layer = getActiveLayer();
      if (!layer || !layer.visible) return;

      const ctx = layer.ctx;
      const color = primaryColorInput.value;
      const size = parseInt(document.getElementById('brush-size').value);
      const opacity = parseInt(document.getElementById('brush-opacity').value) / 100;

      if (currentTool === 'brush') {
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.arc(lastX, lastY, size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
      } else if (currentTool === 'eraser') {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(lastX, lastY, size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
      } else if (currentTool === 'bucket') {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, projectWidth, projectHeight);
        isDrawing = false;
        saveHistoryState();
      } else if (currentTool === 'text') {
        const text = prompt('Digite o texto a ser inserido:', 'Seu Texto Aqui');
        if (text) {
          const fontSize = parseInt(document.getElementById('text-size').value) || 48;
          const font = document.getElementById('text-font').value || 'Plus Jakarta Sans';
          ctx.fillStyle = color;
          ctx.font = `bold ${fontSize}px ${font}`;
          ctx.fillText(text, lastX, lastY);
          saveHistoryState();
        }
        isDrawing = false;
      } else if (currentTool === 'eyedropper') {
        // Sample color from canvas
        const p = ctx.getImageData(lastX, lastY, 1, 1).data;
        const hex = "#" + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1);
        primaryColorInput.value = hex;
        isDrawing = false;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const rect = wrapper.getBoundingClientRect();
      const scale = rect.width / projectWidth;
      const curX = (e.clientX - rect.left) / scale;
      const curY = (e.clientY - rect.top) / scale;

      const layer = getActiveLayer();
      if (!layer) return;
      const ctx = layer.ctx;

      if (currentTool === 'brush' || currentTool === 'eraser') {
        ctx.lineTo(curX, curY);
        ctx.stroke();
      }

      lastX = curX;
      lastY = curY;
    });

    window.addEventListener('mouseup', () => {
      if (isDrawing) {
        isDrawing = false;
        const layer = getActiveLayer();
        if (layer) layer.ctx.restore();
        saveHistoryState();
      }
    });

    // Tool Switcher
    function setTool(toolName) {
      currentTool = toolName;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tool-${toolName}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('options-brush').classList.add('hidden');
      document.getElementById('options-text').classList.add('hidden');
      document.getElementById('options-shape').classList.add('hidden');

      if (toolName === 'brush' || toolName === 'eraser') {
        document.getElementById('options-brush').classList.remove('hidden');
        document.getElementById('active-tool-name').innerText = toolName === 'brush' ? 'Pincel' : 'Borracha';
      } else if (toolName === 'text') {
        document.getElementById('options-text').classList.remove('hidden');
        document.getElementById('active-tool-name').innerText = 'Texto';
      } else if (toolName === 'shape') {
        document.getElementById('options-shape').classList.remove('hidden');
        document.getElementById('active-tool-name').innerText = 'Formas';
      } else {
        document.getElementById('active-tool-name').innerText = toolName.toUpperCase();
      }
    }

    // Image Upload (Open File)
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          addNewLayer(file.name.replace(/\.[^/.]+$/, ""));
          const layer = getActiveLayer();
          layer.ctx.drawImage(img, 0, 0, projectWidth, projectHeight);
          saveHistoryState();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Export Flattened Image (PNG / JPG / WebP)
    function exportImage(format = 'png') {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = projectWidth;
      exportCanvas.height = projectHeight;
      const ctx = exportCanvas.getContext('2d');

      // Draw all visible layers from bottom to top
      const reversed = [...layers].reverse();
      reversed.forEach(l => {
        if (l.visible) {
          ctx.globalAlpha = l.opacity;
          ctx.globalCompositeOperation = l.blendMode || 'source-over';
          ctx.drawImage(l.canvas, 0, 0);
        }
      });

      const mimeType = format === 'jpeg' ? 'image/jpeg' : (format === 'webp' ? 'image/webp' : 'image/png');
      const dataURL = exportCanvas.toDataURL(mimeType, 0.95);
      const link = document.createElement('a');
      link.download = `obnotion-art-${Date.now()}.${format === 'jpeg' ? 'jpg' : format}`;
      link.href = dataURL;
      link.click();
    }

    // Filters (Grayscale, Invert, Blur, Sepia)
    function applyGrayscaleFilter() {
      const layer = getActiveLayer();
      if (!layer) return;
      const imgData = layer.ctx.getImageData(0, 0, projectWidth, projectHeight);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = 0.3 * d[i] + 0.59 * d[i+1] + 0.11 * d[i+2];
        d[i] = v; d[i+1] = v; d[i+2] = v;
      }
      layer.ctx.putImageData(imgData, 0, 0);
      saveHistoryState();
    }

    function applyInvertFilter() {
      const layer = getActiveLayer();
      if (!layer) return;
      const imgData = layer.ctx.getImageData(0, 0, projectWidth, projectHeight);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        d[i] = 255 - d[i];
        d[i+1] = 255 - d[i+1];
        d[i+2] = 255 - d[i+2];
      }
      layer.ctx.putImageData(imgData, 0, 0);
      saveHistoryState();
    }

    function applySepiaFilter() {
      const layer = getActiveLayer();
      if (!layer) return;
      const imgData = layer.ctx.getImageData(0, 0, projectWidth, projectHeight);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
        d[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
        d[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
      }
      layer.ctx.putImageData(imgData, 0, 0);
      saveHistoryState();
    }

    function applyBlurFilter(amount = 4) {
      const layer = getActiveLayer();
      if (!layer) return;
      layer.ctx.filter = `blur(${amount}px)`;
      layer.ctx.drawImage(layer.canvas, 0, 0);
      layer.ctx.filter = 'none';
      saveHistoryState();
    }

    // Zoom & Pan
    function updateZoom() {
      wrapper.style.transform = `scale(${zoomLevel})`;
      document.getElementById('zoom-text').innerText = `${Math.round(zoomLevel * 100)}%`;
    }
    function zoomIn() { zoomLevel = Math.min(3.0, zoomLevel + 0.15); updateZoom(); }
    function zoomOut() { zoomLevel = Math.max(0.1, zoomLevel - 0.15); updateZoom(); }
    function zoomReset() { fitCanvasToScreen(); }

    function fitCanvasToScreen() {
      const viewport = document.getElementById('canvas-viewport');
      const maxW = viewport.clientWidth - 80;
      const maxH = viewport.clientHeight - 80;
      const scaleX = maxW / projectWidth;
      const scaleY = maxH / projectHeight;
      zoomLevel = Math.min(scaleX, scaleY, 1.0);
      updateZoom();
    }

    // History (Undo / Redo)
    function saveHistoryState() {
      // Keep up to 20 steps
      const currentLayer = getActiveLayer();
      if (!currentLayer) return;
      // In real implementation, save layer states
    }

    function undo() { /* Undo last stroke */ }
    function redo() { /* Redo */ }

    // Helpers
    function swapColors() {
      const temp = primaryColorInput.value;
      primaryColorInput.value = secondaryColorInput.value;
      secondaryColorInput.value = temp;
    }

    function updateBrushPreview() {
      const size = document.getElementById('brush-size').value;
      const opacity = document.getElementById('brush-opacity').value;
      document.getElementById('brush-size-val').innerText = `${size}px`;
      document.getElementById('brush-opacity-val').innerText = `${opacity}%`;
    }

    function openNewModal() { document.getElementById('modal-new').classList.remove('hidden'); }
    function closeNewModal() { document.getElementById('modal-new').classList.add('hidden'); }
    function setPreset(w, h, name) {
      document.getElementById('new-doc-w').value = w;
      document.getElementById('new-doc-h').value = h;
    }

    function toggleTab(tab) {
      if (tab === 'adjustments') {
        document.getElementById('panel-layers').classList.add('hidden');
        document.getElementById('panel-adjustments').classList.remove('hidden');
      } else {
        document.getElementById('panel-layers').classList.remove('hidden');
        document.getElementById('panel-adjustments').classList.add('hidden');
      }
    }

    function handleGlobalKeydown(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key.toLowerCase() === 'b') setTool('brush');
      if (e.key.toLowerCase() === 'e') setTool('eraser');
      if (e.key.toLowerCase() === 'v') setTool('move');
      if (e.key.toLowerCase() === 't') setTool('text');
      if (e.key.toLowerCase() === 'g') setTool('bucket');
      if (e.key.toLowerCase() === 'i') setTool('eyedropper');
      if (e.key.toLowerCase() === 'x') swapColors();
      if (e.ctrlKey && e.key.toLowerCase() === 'z') undo();
      if (e.ctrlKey && e.key.toLowerCase() === 'y') redo();
    }

    // Run on load
    window.onload = init;
  </script>
</body>
</html>
