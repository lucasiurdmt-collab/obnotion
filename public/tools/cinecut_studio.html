<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCut Studio • Editor de Vídeo Completo Open-Source</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            }
          },
          fontFamily: {
            sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #060810;
      font-family: 'Inter', -apple-system, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none bg-[#060810] text-slate-100">

  <!-- TOP APP HEADER -->
  <header class="h-12 border-b border-cyan-500/20 bg-[#090d1a] px-3 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-500 via-teal-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/25 font-black text-xs">
        <i data-lucide="scissors" class="w-3.5 h-3.5"></i>
      </div>
      <div>
        <h1 class="text-xs md:text-sm font-bold text-white flex items-center gap-2">
          OpenCut Studio Pro
          <span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 font-bold flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
            CAPCUT OPEN-SOURCE COMPLETO (100% OFICIAL)
          </span>
        </h1>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <!-- Fullscreen Toggle -->
      <button onclick="toggleFullScreen()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-zinc-300 hover:text-white text-xs font-semibold border border-white/[0.1] transition-all" title="Tela Cheia">
        <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Tela Cheia</span>
      </button>

      <!-- Open in New Tab Direct -->
      <a href="https://opencut.app" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 text-xs font-bold border border-cyan-500/30 transition-all shadow-sm shadow-cyan-500/20">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        <span>Abrir em Nova Guia</span>
      </a>

      <!-- Reload Button -->
      <button onclick="reloadOpenCut()" class="p-1.5 px-2 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-zinc-300 hover:text-white text-xs border border-white/[0.1] transition-all" title="Recarregar OpenCut">
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </header>

  <!-- MAIN OPENCUT WORKSPACE (100% COMPLETE ENGINE) -->
  <main class="flex-1 w-full h-full relative overflow-hidden bg-[#000000]">
    
    <!-- Loading Screen -->
    <div id="loadingOverlay" class="absolute inset-0 bg-[#060810] z-20 flex flex-col items-center justify-center p-6 space-y-4 transition-opacity duration-500">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 via-teal-500 to-indigo-600 flex items-center justify-center text-white shadow-2xl shadow-cyan-500/30 animate-pulse">
        <i data-lucide="scissors" class="w-7 h-7"></i>
      </div>
      <div class="text-center space-y-1">
        <h2 class="text-sm font-bold text-white">Carregando OpenCut Studio Oficial...</h2>
        <p class="text-xs text-zinc-400 max-w-sm">Inicializando todas as funções de edição: Linha do tempo completa, efeitos, legendas e aceleração por GPU.</p>
      </div>
      <div class="flex items-center gap-2 text-[11px] font-mono text-cyan-400/90 bg-cyan-950/50 px-3.5 py-1.5 rounded-xl border border-cyan-500/30">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
        100% Código Oficial OpenCut • Todas as Funções Ativas
      </div>
    </div>

    <!-- Embedded Native OpenCut Full Web App -->
    <iframe 
      id="opencutFrame"
      src="https://opencut.app" 
      class="w-full h-full border-0 block bg-[#000000]"
      allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; camera; microphone; display-capture; fullscreen"
      onload="handleIframeLoaded()"
    ></iframe>

  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      // Auto-hide loader fallback
      setTimeout(() => {
        hideLoader();
      }, 2000);
    });

    function handleIframeLoaded() {
      hideLoader();
    }

    function hideLoader() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 500);
      }
    }

    function reloadOpenCut() {
      const overlay = document.getElementById('loadingOverlay');
      const frame = document.getElementById('opencutFrame');
      if (overlay) {
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
      }
      frame.src = 'https://opencut.app?v=' + Date.now();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }
  </script>
</body>
</html>
