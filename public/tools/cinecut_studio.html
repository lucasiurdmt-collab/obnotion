<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCut Studio • Editor de Vídeo Oficial Completo</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #editorIframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background-color: #0d0f17;
    }
  </style>
</head>
<body>
  <iframe 
    id="editorIframe"
    src="about:blank" 
    allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; camera; microphone; display-capture; fullscreen; storage-access"
  ></iframe>

  <script>
    function generateUUID() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getOrCreateProjectId() {
      let id = localStorage.getItem('obnotion_opencut_proj_id');
      if (!id) {
        id = generateUUID();
        localStorage.setItem('obnotion_opencut_proj_id', id);
      }
      return id;
    }

    const projId = getOrCreateProjectId();
    const iframe = document.getElementById('editorIframe');
    iframe.src = 'https://opencut.app/editor?project=' + projId;
  </script>
</body>
</html>
