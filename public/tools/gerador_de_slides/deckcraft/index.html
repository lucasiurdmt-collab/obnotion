<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft</title>
  
<script type="module">
import init, * as bindings from './deckcraft-web-262011de9bd65d5a.js';
const wasm = await init({ module_or_path: './deckcraft-web-262011de9bd65d5a_bg.wasm' });

window.wasmBindings = bindings;

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

// Notificar janela-mãe (Slide Killer Hub)
try {
  window.parent.postMessage({ type: 'DECKCRAFT_READY' }, '*');
} catch(e) {}

let fileLoaded = false;

// Ouvinte de mensagens da Central Multimídia para carregar arquivos PPTX automaticamente
window.addEventListener('message', async (e) => {
  if (!e.data) return;
  if (e.data.type === 'LOAD_PPTX_BLOB' || e.data.type === 'LOAD_PPTX') {
    fileLoaded = true;
    try {
      const { blob, buffer, name } = e.data;
      const fileData = blob || (buffer ? new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' }) : null);
      if (!fileData) return;
      const file = new File([fileData], name || 'slides_culto.pptx', {
        type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
      });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById('deckcraft_canvas');
      if (canvas) {
        const dropEvt = new DragEvent('drop', {
          bubbles: true,
          cancelable: true,
          dataTransfer: dt
        });
        canvas.dispatchEvent(dropEvt);
        console.log('[DeckCraft] Evento drop de PPTX disparado:', file.name);
      }
    } catch (err) {
      console.warn('[DeckCraft] Falha ao injetar evento de arquivo:', err);
    }
  }
});

// Suporte para arrastar e soltar arquivo em qualquer lugar da tela com feedback visual
let dragCounter = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCounter++;
  const overlay = document.getElementById('deckcraft_drop_overlay');
  if (overlay) overlay.style.display = 'flex';
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    const overlay = document.getElementById('deckcraft_drop_overlay');
    if (overlay) overlay.style.display = 'none';
  }
});
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('drop', (e) => {
  fileLoaded = true;
  dragCounter = 0;
  const overlay = document.getElementById('deckcraft_drop_overlay');
  if (overlay) overlay.style.display = 'none';

  const canvas = document.getElementById('deckcraft_canvas');
  if (e.target !== canvas && canvas && e.dataTransfer && e.dataTransfer.files.length > 0) {
    e.preventDefault();
    const dropEvt = new DragEvent('drop', {
      bubbles: true,
      cancelable: true,
      dataTransfer: e.dataTransfer
    });
    canvas.dispatchEvent(dropEvt);
  }
});

// Pré-carregamento das fontes oficiais para o motor WebAssembly
if (document.fonts) {
  Promise.all([
    document.fonts.load('600 16px "Bahnschrift SemiBold Condensed"'),
    document.fonts.load('400 16px "Bahnschrift"'),
    document.fonts.load('700 16px "Anton"'),
    document.fonts.load('400 16px "Bebas Neue"'),
    document.fonts.load('700 16px "Oswald"'),
    document.fonts.load('700 16px "Roboto Condensed"')
  ]).catch(() => {});
}

// Se nenhum arquivo específico for enviado pela janela-mãe nos primeiros 1.2s (ex: abertura standalone do DeckCraft),
// carrega o template oficial padrão com a fonte Bahnschrift SemiBold Condensed
setTimeout(async () => {
  if (fileLoaded) return;
  try {
    const res = await fetch('./template.pptx');
    if (res.ok && !fileLoaded) {
      const blob = await res.blob();
      const file = new File([blob], 'apresentacao_padrao.pptx', {
        type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
      });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById('deckcraft_canvas');
      if (canvas && !fileLoaded) {
        const dropEvt = new DragEvent('drop', {
          bubbles: true,
          cancelable: true,
          dataTransfer: dt
        });
        canvas.dispatchEvent(dropEvt);
        console.log('[DeckCraft] Template padrão Bahnschrift SemiBold Condensed carregado com sucesso!');
      }
    }
  } catch (err) {
    console.warn('[DeckCraft] Aviso ao carregar template padrão:', err);
  }
}, 1200);
</script>
