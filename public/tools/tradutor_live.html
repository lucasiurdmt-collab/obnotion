<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tradutor Inteligente • Obnotion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #060810; color: #fff; overscroll-behavior: none; }
    .ptt-btn {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition: all 0.2s ease;
    }
    .ptt-active {
      transform: scale(0.96);
      filter: brightness(1.3);
      box-shadow: inset 0 0 30px rgba(255,255,255,0.2), 0 0 20px rgba(255,255,255,0.2);
    }
    .wave {
      display: inline-block;
      width: 4px;
      height: 12px;
      border-radius: 2px;
      margin: 0 2px;
      background: currentColor;
      animation: wave 1s ease-in-out infinite;
    }
    .wave:nth-child(2) { animation-delay: 0.1s; }
    .wave:nth-child(3) { animation-delay: 0.2s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1.5); }
    }
  </style>
</head>
<body class="h-full w-full flex flex-col overflow-hidden select-none">
  
  <div id="connectOverlay" class="absolute inset-0 z-50 bg-[#060810] flex flex-col items-center justify-center p-6">
    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(16,185,129,0.3)]">
      <i data-lucide="languages" class="w-8 h-8 text-white"></i>
    </div>
    <h2 class="text-2xl font-bold text-white mb-2 text-center">Tradutor Pessoal</h2>
    <p class="text-zinc-400 text-center mb-8 max-w-xs">Toque em um dos botões para abrir o microfone. A IA traduzirá automaticamente.</p>
    
    <div class="w-full max-w-xs mb-8">
      <label class="block text-sm text-zinc-400 mb-2 font-bold">Idioma do Estrangeiro:</label>
      <select id="targetLang" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-4 text-white font-bold outline-none focus:border-emerald-500 appearance-none">
        <option value="Inglês">🇺🇸 Inglês</option>
        <option value="Espanhol">🇪🇸 Espanhol</option>
        <option value="Francês">🇫🇷 Francês</option>
        <option value="Italiano">🇮🇹 Italiano</option>
        <option value="Alemão">🇩🇪 Alemão</option>
      </select>
    </div>

    <button id="btnConnect" class="w-full max-w-xs py-4 rounded-full bg-emerald-600 text-white font-bold text-lg shadow-lg active:scale-95 transition-transform">
      Conectar Áudio
    </button>
  </div>

  <header class="p-4 border-b border-white/10 flex items-center justify-between shrink-0 bg-[#0a0d1c] z-10 relative shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center text-emerald-400">
        <i data-lucide="mic" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight" id="headerTitle">Tradutor</h1>
        <p id="connStatus" class="text-xs text-zinc-500 font-mono">Aguardando...</p>
      </div>
    </div>
    <button onclick="window.close()" class="p-2 rounded-full bg-white/5 hover:bg-white/10 text-zinc-400">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </header>

  <main class="flex-1 flex flex-col items-center justify-between overflow-hidden relative">
    
    <div class="w-full flex-1 flex flex-col overflow-hidden relative z-10">
      <div class="flex-1 overflow-y-auto p-4 space-y-4 pb-4 scroll-smooth flex flex-col-reverse" id="transcriptContainer">
        <!-- Messages -->
      </div>
    </div>

    <div class="shrink-0 w-full bg-[#0a0d1c] border-t border-white/5 p-4 flex flex-col gap-3 z-20 pb-8">
      
      <button id="btnForeign" class="ptt-btn w-full h-20 rounded-2xl bg-blue-600/20 border-2 border-blue-600 flex items-center justify-center text-blue-400 transition-all">
        <div class="flex items-center gap-3 pointer-events-none">
          <i data-lucide="message-circle" class="w-6 h-6" id="iconForeign"></i>
          <span class="font-bold tracking-wide text-lg" id="lblForeign">TOQUE SE ELE FALAR</span>
        </div>
      </button>

      <button id="btnUser" class="ptt-btn w-full h-20 rounded-2xl bg-emerald-600/20 border-2 border-emerald-600 flex items-center justify-center text-emerald-400 transition-all">
        <div class="flex items-center gap-3 pointer-events-none">
          <i data-lucide="mic" class="w-6 h-6" id="iconUser"></i>
          <span class="font-bold tracking-wide text-lg" id="lblUser">TOQUE SE VOCÊ FALAR</span>
        </div>
      </button>

    </div>
  </main>

  <script>
    lucide.createIcons();

    const DEFAULT_KEY = atob('QVEuQWI4Uk42SlRZTDlzMlNOT3BSWWptNzlsdWVHTzVMS2lnei1hSzBVOXRydVBCUDR1Smc=');
    const apiKey = localStorage.getItem('GEMINI_API_KEY') || DEFAULT_KEY;

    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let micNode = null;
    let processorNode = null;
    
    let isConnected = false;
    let isMicMuted = true;
    let nextPlayTime = 0;
    let targetLang = "Inglês";
    
    // Toggle States
    let activeBtn = null; // 'user' ou 'foreign' ou null

    const transcriptContainer = document.getElementById('transcriptContainer');
    const connStatus = document.getElementById('connStatus');
    
    const btnConnect = document.getElementById('btnConnect');
    const btnForeign = document.getElementById('btnForeign');
    const btnUser = document.getElementById('btnUser');
    const lblForeign = document.getElementById('lblForeign');
    const lblUser = document.getElementById('lblUser');
    const iconForeign = document.getElementById('iconForeign');
    const iconUser = document.getElementById('iconUser');
    const connectOverlay = document.getElementById('connectOverlay');
    const targetLangSelect = document.getElementById('targetLang');
    const headerTitle = document.getElementById('headerTitle');

    function addBubble(text, isUser) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
      
      const bubble = document.createElement('div');
      bubble.className = `max-w-[85%] rounded-2xl px-4 py-3 text-[15px] leading-relaxed shadow-lg ${
        isUser ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-blue-600 text-white rounded-bl-none'
      }`;
      bubble.textContent = text;
      
      wrapper.appendChild(bubble);
      transcriptContainer.prepend(wrapper);
    }

    function renderWaves(htmlString) {
      return `<div class="flex items-center gap-1">${htmlString}</div>`;
    }

    function updateButtons() {
      if (activeBtn === 'user') {
        isMicMuted = false;
        btnUser.classList.add('ptt-active');
        btnUser.classList.replace('bg-emerald-600/20', 'bg-emerald-600/60');
        lblUser.innerHTML = renderWaves('<div class="wave"></div><div class="wave"></div><div class="wave"></div><span class="ml-2">OUVINDO...</span>');
        
        btnForeign.classList.remove('ptt-active');
        btnForeign.classList.replace('bg-blue-600/60', 'bg-blue-600/20');
        lblForeign.textContent = `TOQUE SE ELE FALAR`;
      } 
      else if (activeBtn === 'foreign') {
        isMicMuted = false;
        btnForeign.classList.add('ptt-active');
        btnForeign.classList.replace('bg-blue-600/20', 'bg-blue-600/60');
        lblForeign.innerHTML = renderWaves('<div class="wave"></div><div class="wave"></div><div class="wave"></div><span class="ml-2">OUVINDO...</span>');
        
        btnUser.classList.remove('ptt-active');
        btnUser.classList.replace('bg-emerald-600/60', 'bg-emerald-600/20');
        lblUser.textContent = `TOQUE SE VOCÊ FALAR`;
      } 
      else {
        isMicMuted = true;
        btnUser.classList.remove('ptt-active');
        btnUser.classList.replace('bg-emerald-600/60', 'bg-emerald-600/20');
        lblUser.textContent = `TOQUE SE VOCÊ FALAR`;
        
        btnForeign.classList.remove('ptt-active');
        btnForeign.classList.replace('bg-blue-600/60', 'bg-blue-600/20');
        lblForeign.textContent = `TOQUE SE ELE FALAR`;
      }
    }

    // Toggle logic for Touch / Click
    btnUser.addEventListener('click', () => {
      if (!isConnected) return;
      activeBtn = (activeBtn === 'user') ? null : 'user';
      updateButtons();
    });

    btnForeign.addEventListener('click', () => {
      if (!isConnected) return;
      activeBtn = (activeBtn === 'foreign') ? null : 'foreign';
      updateButtons();
    });

    btnConnect.addEventListener('click', async () => {
      targetLang = targetLangSelect.value;
      headerTitle.textContent = `Tradutor (${targetLang})`;
      
      btnConnect.textContent = "Conectando...";
      btnConnect.disabled = true;

      try {
        await startSession();
        connectOverlay.style.display = 'none';
        isConnected = true;
      } catch (e) {
        console.error(e);
        btnConnect.textContent = "Erro. Tentar novamente";
        btnConnect.disabled = false;
        alert("Erro ao conectar microfone ou servidor. Detalhes: " + e.message);
      }
    });

    async function startSession() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      nextPlayTime = audioCtx.currentTime;

      const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      ws = new WebSocket(url);

      return new Promise((resolve, reject) => {
        ws.onopen = async () => {
          connStatus.textContent = "Configurando IA...";
          connStatus.className = "text-xs text-blue-400 font-mono";
          
          const setupMsg = {
            setup: {
              model: "models/gemini-3.1-flash-live-preview",
              generationConfig: {
                responseModalities: ["TEXT", "AUDIO"],
                speechConfig: {
                  voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } }
                }
              },
              systemInstruction: {
                parts: [{
                  text: `Você é um tradutor simultâneo bilíngue passivo (Português <-> ${targetLang}). Regras absolutas:
1. NUNCA adicione palavras suas, nunca responda perguntas, nunca inicie conversas. APENAS TRADUZA o áudio.
2. Se o áudio ouvido for em Português, gere o áudio falado apenas em ${targetLang}.
3. Se o áudio ouvido for em ${targetLang}, gere o áudio falado apenas em Português.`
                }]
              }
            }
          };
          ws.send(JSON.stringify(setupMsg));

          try {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                sampleRate: 16000,
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
              }
            });
          } catch(err) {
            reject(err);
            return;
          }

          const workletCode = `
            class PCMProcessor extends AudioWorkletProcessor {
              constructor() {
                super();
                this.bufferSize = 4096;
                this.buffer = new Int16Array(this.bufferSize);
                this.offset = 0;
              }
              process(inputs, outputs, parameters) {
                const input = inputs[0];
                if (input && input.length > 0) {
                  const channel = input[0];
                  for (let i = 0; i < channel.length; i++) {
                    let s = Math.max(-1, Math.min(1, channel[i]));
                    this.buffer[this.offset++] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    if (this.offset >= this.bufferSize) {
                      const copy = new Int16Array(this.buffer);
                      this.port.postMessage(copy.buffer, [copy.buffer]);
                      this.offset = 0;
                    }
                  }
                }
                return true;
              }
            }
            registerProcessor('pcm-processor', PCMProcessor);
          `;
          const blob = new Blob([workletCode], { type: 'application/javascript' });
          await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));

          micNode = audioCtx.createMediaStreamSource(micStream);
          processorNode = new AudioWorkletNode(audioCtx, 'pcm-processor');

          processorNode.port.onmessage = (e) => {
            if (ws.readyState === WebSocket.OPEN) {
              const buffer = e.data;
              const bytes = new Uint8Array(buffer);
              
              if (isMicMuted) {
                // Ao invés de cortar o envio (o que faz a IA ficar esperando para sempre),
                // enviamos silêncio absoluto (zeros). Assim o VAD da IA detecta que terminamos de falar.
                for (let i = 0; i < bytes.length; i++) {
                  bytes[i] = 0;
                }
              }

              let binary = '';
              const len = bytes.byteLength;
              for (let i = 0; i < len; i++) {
                  binary += String.fromCharCode(bytes[i]);
              }
              const base64 = window.btoa(binary);

              ws.send(JSON.stringify({
                realtimeInput: {
                  mediaChunks: [{
                    mimeType: "audio/pcm;rate=16000",
                    data: base64
                  }]
                }
              }));
            }
          };

          micNode.connect(processorNode);
          processorNode.connect(audioCtx.destination);

          connStatus.innerHTML = '<span class="inline-block w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse mr-1"></span>Online';
          connStatus.className = "text-xs text-emerald-400 font-mono";
          resolve();
        };

        ws.onmessage = (evt) => {
          try {
            if (evt.data instanceof Blob) return;
            const res = JSON.parse(evt.data);
            const content = res.serverContent;
            
            if (content) {
              if (content.interrupted) {
                nextPlayTime = audioCtx.currentTime;
              }

              if (content.modelTurn && content.modelTurn.parts) {
                content.modelTurn.parts.forEach(part => {
                  if (part.inlineData && part.inlineData.data) {
                    playAudioBuffer(part.inlineData.data);
                  }
                });
              }

              if (content.inputTranscription && content.inputTranscription.text) {
                const text = content.inputTranscription.text.trim();
                if (text.length > 1) addBubble(text, true);
              }
              if (content.outputTranscription && content.outputTranscription.text) {
                const text = content.outputTranscription.text.trim();
                if (text.length > 1) addBubble(text, false);
                // Turn off active button automatically when AI answers? No, keep it as user defined
              }
            }
          } catch (e) {
            console.error("Parse error", e);
          }
        };

        ws.onerror = (e) => {
          console.error("WS Error", e);
          connStatus.textContent = "Erro na nuvem";
          connStatus.className = "text-xs text-rose-500 font-mono";
        };

        ws.onclose = () => {
          connStatus.textContent = "Desconectado";
          connStatus.className = "text-xs text-zinc-500 font-mono";
          isConnected = false;
          activeBtn = null;
          updateButtons();
        };
      });
    }

    function playAudioBuffer(base64) {
      if (!audioCtx) return;
      
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      
      const pcm16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(pcm16.length);
      for (let i = 0; i < pcm16.length; i++) {
        float32[i] = pcm16[i] / 32768;
      }

      const audioBuffer = audioCtx.createBuffer(1, float32.length, 24000);
      audioBuffer.getChannelData(0).set(float32);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      if (nextPlayTime < audioCtx.currentTime) {
        nextPlayTime = audioCtx.currentTime;
      }
      
      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    }
  </script>
</body>
</html>
